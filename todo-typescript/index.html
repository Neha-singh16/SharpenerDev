<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>To-Do List</h1>

    <div class="input-section">
        <input
            type="text"
            id="taskName"
            placeholder="Enter Task">

        <input
            type="date"
            id="dueDate">

        <button id="addBtn">
            Add Task
        </button>
    </div>

    <ul id="taskList"></ul>

</div>

<script src="app.js"></script>

</body>
</html>
