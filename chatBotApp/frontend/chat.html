<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatMe</title>

    <link rel="stylesheet" href="chat.css">
</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <div class="profile">
            <div class="avatar">🤖</div>

            <div class="details">
                <h3>ChatMe Assistant</h3>
                <span>Online</span>
            </div>
        </div>
    </div>

    <div class="chat-body" id="chatBody">

        <div class="message received">
            <div class="bubble">
                Hello 👋
                <span>11:10 AM</span>
            </div>
        </div>

        <div class="message sent">
            <div class="bubble">
                Hi! I need help planning a trip.
                <span>11:11 AM</span>
            </div>
        </div>

        <div class="message received">
            <div class="bubble">
                Sure 😊 Where are you travelling?
                <span>11:11 AM</span>
            </div>
        </div>

    </div>

    <form class="chat-input">

        <input
            type="text"
            placeholder="Type your message..."
            id="messageInput">

        <button>
            ➤
        </button>

    </form>

</div>

</body>
</html>
