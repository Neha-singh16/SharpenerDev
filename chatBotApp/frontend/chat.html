<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ChatMe</title>

    <link rel="stylesheet" href="chat.css" />
  </head>

  <body>
    <div class="app">
      <!-- ================= SIDEBAR ================= -->

      <aside class="sidebar">
        <div class="logo">
          <h2>💬 ChatMe</h2>
        </div>

        <div class="search-section">
          <input
            type="email"
            id="emailInput"
            placeholder="Search user by email"
          />

          <button id="searchBtn">Search</button>
        </div>

        <button id="createGroupBtn">➕ Create Group</button>

        <h3 class="section-title">Chats</h3>

        <div id="conversationList">
          <!-- Personal chats and Groups appear here -->
        </div>
        <!-- <div></div> -->
      </aside>

      <!-- ================= CHAT ================= -->

      <main class="chat-container">
        <div class="chat-header">
          <div class="profile">
            <div class="avatar">💬</div>

            <div>
              <h3 id="chatUser">Select a Conversation</h3>

              <span id="chatStatus"> Start chatting... </span>
            </div>
          </div>
        </div>

        <div id="chatBody" class="chat-body"></div>

        <form id="chatForm" class="chat-input">
          <!-- <input
            id="messageInput"
            type="text"
            placeholder="Type your message..."
          />
          <input type="file" id="mediaInput" hidden />

          <button type="button" id="mediaBtn">📎</button>
          <button type="submit">➤</button> -->

          <!-- --------------- -->

          <input
            id="messageInput"
            type="text"
            placeholder="Type your message..."
          />

          <input type="file" id="mediaInput" hidden />

          <button type="button" id="mediaBtn">📎</button>

          <button type="submit">➤</button>
        </form>
      </main>
    </div>

    <!-- ================= CREATE GROUP MODAL ================= -->

    <div id="groupModal" class="modal">
      <div class="modal-content">
        <h2>Create Group</h2>

        <input id="groupName" placeholder="Enter Group Name" />

        <textarea
          id="memberEmails"
          rows="5"
          placeholder="Enter member emails (comma separated)"
        ></textarea>

        <div class="modal-buttons">
          <button id="createGroup">Create</button>

          <button id="closeModal">Cancel</button>
        </div>
      </div>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="js/socket.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/personal.js"></script>
    <script src="js/group.js"></script>
    <script src="js/media.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
